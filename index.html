<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Secret Santa</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Memoized video component prevents re-mounting on every keystroke/state update
        const IntroVideo = React.memo(() => (
            <div className="w-full my-4">
                <video 
                    controls 
                    autoPlay 
                    muted 
                    loop 
                    playsInline
                    className="w-full rounded-lg shadow-sm border"
                >
                    <source src="./assets/intro.mp4" type="video/mp4" />
                    Your browser does not support the video tag.
                </video>
            </div>
        ));

        const SecretSanta = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [setupMode, setSetupMode] = useState(true);
            const [participants, setParticipants] = useState([]);
            const [newParticipant, setNewParticipant] = useState('');
            const [assignments, setAssignments] = useState(new Map());
            const [playerName, setPlayerName] = useState('');
            const [showAssignment, setShowAssignment] = useState(false);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                const hash = window.location.hash.substring(1);
                if (hash) {
                    try {
                        const gameData = JSON.parse(atob(hash));
                        setParticipants(gameData.participants);
                        setAssignments(new Map(gameData.assignments));
                        setSetupMode(false);
                        setShowWelcome(false); // Skip welcome if joining an active game link
                    } catch (e) {
                        console.error('Invalid game data');
                    }
                }
            }, []);

            const addParticipant = () => {
                if (newParticipant && !participants.includes(newParticipant)) {
                    setParticipants([...participants, newParticipant]);
                    setNewParticipant('');
                }
            };

            const removeParticipant = (name) => {
                setParticipants(participants.filter(p => p !== name));
            };

            const startGame = () => {
                const shuffled = [...participants];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                
                const newAssignments = new Map();
                shuffled.forEach((person, index) => {
                    const nextPerson = shuffled[(index + 1) % shuffled.length];
                    newAssignments.set(person, nextPerson);
                });
                
                setAssignments(newAssignments);
                setSetupMode(false);
                
                const gameData = {
                    participants: shuffled,
                    assignments: Array.from(newAssignments.entries())
                };
                const encodedData = btoa(JSON.stringify(gameData));
                window.location.hash = encodedData;
            };

            const copyShareLink = () => {
                const shareLink = window.location.href;
                navigator.clipboard.writeText(shareLink);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const revealAssignment = () => {
                if (playerName && assignments.has(playerName)) {
                    setShowAssignment(true);
                }
            };

            // 1. WELCOME PAGE (Video + Start Button)
            if (showWelcome) {
                return (
                    <div className="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6 mt-8">
                        <div className="text-2xl font-bold mb-4 flex items-center justify-center gap-2 text-center">
                            <span role="img" aria-label="gift">🎁</span>
                            Welcome to Family Secret Santa!
                        </div>

                        {/* Intro Video */}
                        <IntroVideo />

                        <button 
                            onClick={() => setShowWelcome(false)}
                            className="w-full mt-4 p-3 bg-red-600 text-white font-bold text-lg rounded-lg hover:bg-red-700 transition duration-200 shadow"
                        >
                            Start Secret Santa!
                        </button>
                    </div>
                );
            }

            // 2. SETUP MODE (Adding Participants)
            if (setupMode) {
                return (
                    <div className="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6 mt-8">
                        <div className="text-2xl font-bold mb-6 flex items-center gap-2">
                            <span role="img" aria-label="gift">🎁</span>
                            Family Secret Santa - Setup
                        </div>
                        
                        <div className="space-y-4">
                            <div className="bg-blue-50 border border-blue-200 rounded p-4 text-blue-700 mb-4">
                                Add all family members, then generate the Secret Santa assignments!
                            </div>

                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    placeholder="Enter family member's name"
                                    value={newParticipant}
                                    onChange={(e) => setNewParticipant(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && addParticipant()}
                                    className="flex-1 p-2 border rounded"
                                />
                                <button 
                                    onClick={addParticipant}
                                    className="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                                >
                                    Add
                                </button>
                            </div>

                            <div className="space-y-2">
                                {participants.map((name) => (
                                    <div key={name} className="flex items-center justify-between p-2 bg-gray-50 rounded">
                                        <span>{name}</span>
                                        <button
                                            onClick={() => removeParticipant(name)}
                                            className="text-red-500 hover:text-red-700"
                                        >
                                            Remove
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {/* Generate Assignments Button / Alert */}
                            {participants.length >= 2 ? (
                                <button 
                                    onClick={startGame}
                                    className="w-full p-2 bg-green-500 text-white rounded hover:bg-green-600"
                                >
                                    Generate Assignments & Share
                                </button>
                            ) : (
                                <div className="bg-yellow-50 border border-yellow-200 rounded p-4 text-yellow-700">
                                    Add at least 2 family members to generate assignments
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // 3. GAMEPLAY MODE (Selecting name & revealing recipient)
            return (
                <div className="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6 mt-8">
                    <div className="text-2xl font-bold mb-6 flex items-center gap-2">
                        <span role="img" aria-label="gift">🎁</span>
                        Family Secret Santa
                    </div>
                    
                    <div className="space-y-4">
                        {!showAssignment ? (
                            <div className="space-y-4">
                                {assignments.size > 0 && (
                                    <div className="space-y-4">
                                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                                            <div className="flex items-center">
                                                <div className="text-yellow-700">
                                                    <strong>⚠️ Important:</strong> Copy this link before refreshing or closing the page! 
                                                    If you lose this link, you'll need to start over with new random assignments.
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-blue-50 border border-blue-200 rounded p-4 text-blue-700">
                                            <div className="mb-2">Share this link with all participants:</div>
                                            <button 
                                                onClick={copyShareLink}
                                                className="w-full p-2 bg-blue-500 text-white rounded hover:bg-blue-600 flex items-center justify-center gap-2"
                                            >
                                                {copied ? '✓ Copied!' : 'Copy Share Link'}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <div className="flex gap-2">
                                    <select 
                                        className="flex-1 p-2 border rounded"
                                        onChange={(e) => setPlayerName(e.target.value)}
                                        value={playerName}
                                    >
                                        <option value="">Select your name</option>
                                        {participants.map((name) => (
                                            <option key={name} value={name}>{name}</option>
                                        ))}
                                    </select>
                                    <button 
                                        onClick={revealAssignment}
                                        disabled={!playerName}
                                        className="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 disabled:opacity-50"
                                    >
                                        Show My Assignment
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-green-50 border border-green-200 rounded p-4 text-green-700">
                                <div className="flex items-center gap-2 mb-4">
                                    <span>{playerName}</span>
                                    <span>→</span>
                                    <strong>{assignments.get(playerName)}</strong>
                                </div>
                                <div className="text-sm">
                                    Remember who you're getting a gift for! You can close this page now.
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SecretSanta />, document.getElementById('root'));
    </script>
</body>
</html>
